name: 'Setup tier data'

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Which tier should be generated?
        type: choice
        required: true
        default: A
        options:
          - A
          - B
          - C
          - D
          - MISSING
          - NOT_SUPERVISED
      gender:
        description: Which gender should be generated?
        type: choice
        required: true
        default: Male
        options:
          - Male
          - Female
      dob:
        description: 'DOB for the generated person (YYYY-MM-DD). Leave blank for default.'
        type: string
        required: false
        default: ''
      release-from-prison:
        description: Release from prison
        type: boolean
        required: false
        default: true
      release-date:
        description: >-
          Expected release date (YYYY-MM-DD). If set, the prisoner stays in custody with this as
          their confirmed release date, overriding 'Release from prison'. Leave blank to use
          'Release from prison' instead.
        type: string
        required: false
        default: ''
      sexual-offence:
        description: >-
          Sexual offences: add a sexual offence as the person's conviction. Unselect for a
          non-sexual offence instead; does not affect the selected tier.
        type: boolean
        required: false
        default: true
  workflow_call:
    inputs:
      tier:
        description: Which tier should be generated?
        type: string
        required: true
        default: A
      gender:
        description: Which gender should be generated?
        type: string
        required: true
        default: Male
      dob:
        description: 'DOB for the generated person (YYYY-MM-DD). Leave blank for default.'
        type: string
        required: false
        default: ''
      release-from-prison:
        description: Release from prison
        type: boolean
        required: false
        default: true
      release-date:
        description: >-
          Expected release date (YYYY-MM-DD). If set, the prisoner stays in custody with this as
          their confirmed release date, overriding 'Release from prison'. Leave blank to use
          'Release from prison' instead.
        type: string
        required: false
        default: ''
      sexual-offence:
        description: >-
          Sexual offences: add a sexual offence as the person's conviction. Unselect for a
          non-sexual offence instead; does not affect the selected tier.
        type: boolean
        required: false
        default: true
    outputs:
      crn:
        description: The CRN of the generated test person
        value: ${{ jobs.setup-tier-person.outputs.crn }}
      name:
        description: The name of the generated test person
        value: ${{ jobs.setup-tier-person.outputs.name }}
permissions:
  contents: read

jobs:
  setup-tier-person:
    name: 'Generate CRN with the selected tier'
    runs-on: [ self-hosted, hmpps-github-actions-runner ]
    outputs:
      crn: ${{ steps.read-output.outputs.crn }}
      name: ${{ steps.read-output.outputs.name }}
    env:
      TZ: Europe/London
      DELIUS_URL: https://ndelius.test.probation.service.justice.gov.uk
      AUTH_URL: https://sign-in-dev.hmpps.service.justice.gov.uk
      PRISON_API: https://prison-api-dev.prison.service.justice.gov.uk
      OASYS_URL: https://t2.oasys.service.justice.gov.uk/eor/f?p=100:101
      TIER_API_URL: https://hmpps-tier-dev.hmpps.service.justice.gov.uk
      DELIUS_USERNAME: ${{ secrets.E2E_DELIUS_USERNAME }}
      DELIUS_PASSWORD: ${{ secrets.E2E_DELIUS_PASSWORD }}
      DPS_USERNAME: ${{ secrets.E2E_DPS_USERNAME }}
      HMPPS_AUTH_CLIENT_ID: ${{ secrets.E2E_HMPPS_AUTH_CLIENT_ID }}
      HMPPS_AUTH_CLIENT_SECRET: ${{ secrets.E2E_HMPPS_AUTH_CLIENT_SECRET }}
      OASYS_USERNAME_BOOKING: ${{ secrets.E2E_OASYS_USERNAME_BOOKING }}
      OASYS_PASSWORD_BOOKING: ${{ secrets.E2E_OASYS_PASSWORD_BOOKING }}
      CRN_OUTPUT_FILE: tier-generation-output.json
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Normalise tier input
        env:
          INPUT_TIER: ${{ inputs.tier }}
          INPUT_GENDER: ${{ inputs.gender }}
          INPUT_DOB: ${{ inputs.dob }}
          INPUT_RELEASE_FROM_PRISON: ${{ inputs.release-from-prison }}
          INPUT_RELEASE_DATE: ${{ inputs.release-date }}
          INPUT_SEXUAL_OFFENCE: ${{ inputs.sexual-offence }}
        run: |
          if [ "$INPUT_TIER" = "NOT_SUPERVISED" ]; then
            echo "CAS1_E2E_PERSON_TIER=NOT_SUPERVISED" >> "$GITHUB_ENV"
          else
            echo "CAS1_E2E_PERSON_TIER=$INPUT_TIER" >> "$GITHUB_ENV"
          fi
          echo "CAS1_E2E_PERSON_GENDER=$INPUT_GENDER" >> "$GITHUB_ENV"
          echo "CAS1_E2E_PERSON_DOB=$INPUT_DOB" >> "$GITHUB_ENV"
          echo "CAS1_E2E_RELEASE_FROM_PRISON=$INPUT_RELEASE_FROM_PRISON" >> "$GITHUB_ENV"
          echo "CAS1_E2E_RELEASE_DATE=$INPUT_RELEASE_DATE" >> "$GITHUB_ENV"
          echo "CAS1_E2E_SEXUAL_OFFENCE=$INPUT_SEXUAL_OFFENCE" >> "$GITHUB_ENV"

      - name: Generate person
        timeout-minutes: 10
        run: npm run test:e2e:ci -- e2e/tests/generate-crn-with-tier.spec.ts

      - name: Upload generated user data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-tier-person
          path: tier-generation-output.json
          retention-days: 5
          if-no-files-found: error

      - name: Read generated CRN
        id: read-output
        run: |
          echo "crn=$(jq -r '.crn' "$CRN_OUTPUT_FILE")" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r '.name' "$CRN_OUTPUT_FILE")" >> "$GITHUB_OUTPUT"
