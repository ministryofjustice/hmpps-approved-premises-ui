---
# Per environment values which override defaults in approved-premises-ui/values.yaml

generic-service:
  replicaCount: 2
  
  ingress:
    hosts:
      - approved-premises-test.hmpps.service.justice.gov.uk
    contextColour: green
    tlsSecretName: hmpps-approved-premises-test-cert

  env:
    ENVIRONMENT: test
    APPROVED_PREMISES_API_URL: 'https://approved-premises-api-test.hmpps.service.justice.gov.uk'
    INGRESS_URL: 'https://approved-premises-test.hmpps.service.justice.gov.uk'
    HMPPS_AUTH_URL: 'https://sign-in-dev.hmpps.service.justice.gov.uk/auth'
    TOKEN_VERIFICATION_API_URL: 'https://token-verification-api-dev.prison.service.justice.gov.uk'
    COMMUNITY_ACCOMMODATION_API_SERVICE_NAME: approved-premises
    COMMUNITY_ACCOMMODATION_API_TIMEOUT_RESPONSE: 30000
    COMMUNITY_ACCOMMODATION_API_TIMEOUT_DEADLINE: 30000
    NDELIUS_DEEPLINK: 'https://ndelius.test.probation.service.justice.gov.uk/NDelius-war/delius/JSP/deeplink.xhtml'
    CAS2_START_LINK: 'https://community-accommodation-tier-2-bail-dev.hmpps.service.justice.gov.uk/new-cohorts/applications/before-you-start'
    CAS3_START_LINK: 'https://transitional-accommodation-dev.hmpps.service.justice.gov.uk/referrals/start'
    IN_MAINTENANCE_MODE: false
    PLANNED_MAINTENANCE_BANNER: false
    # required so hmpps-audit-client doesn't raise an error
    AUDIT_SQS_QUEUE_URL: ""
    AUDIT_SQS_QUEUE_NAME: ""
    NDELIUS_RISK_FLAGS_ENABLED: 'true'
    OASYS_SIX_MONTH_RULE_DISABLED: 'true'
    USE_LIVE_TIER: 'true'
    V3_TIERS: 'true'

generic-prometheus-alerts:
  alertSeverity: hmpps-approved-premises-nonprod
